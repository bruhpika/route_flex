<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Curateur - The Cover</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&amp;family=Satoshi:wght@300;400;500;700&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#edbc1d",
                        "background-light": "#f8f8f6",
                        "background-dark": "#221e10",
                        "curateur-dark": "#0A0B0A",
                        "curateur-text": "#EAE8E3",
                        "curateur-muted": "#8C8D8A",
                        "curateur-surface": "rgba(234, 232, 227, 0.04)",
                        "curateur-border": "rgba(234, 232, 227, 0.08)",
                    },
                    fontFamily: {
                        "display": ["Playfair Display", "serif"],
                        "body": ["Satoshi", "sans-serif"],
                    },
                    borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
                    animation: {
                        'slow-zoom': 'slowZoom 30s ease-in-out infinite alternate',
                    },
                    keyframes: {
                        slowZoom: {
                            '0%': { transform: 'scale(1)' },
                            '100%': { transform: 'scale(1.1)' },
                        }
                    }
                },
            },
        }
    </script>
<style>
        body {
            background-color: theme('colors.curateur-dark');
            color: theme('colors.curateur-text');
            margin: 0;
            overflow-x: hidden;
            font-family: theme('fontFamily.body');
        }
        
        .glass-panel {
            background-color: theme('colors.curateur-surface');
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid theme('colors.curateur-border');
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.4);
        }

        /* Base styles to support the requested interactions, though actual scroll interaction requires JS */
        .hero-title-container {
            transition: opacity 0.5s ease, transform 0.5s ease;
        }
    </style>
</head>
<body class="antialiased min-h-screen relative flex flex-col">
<!-- Top Navigation from Shared Components, integrated as requested -->
<div class="absolute top-0 left-0 w-full z-50">
<header class="flex items-center justify-between whitespace-nowrap px-10 py-6 border-b border-solid border-curateur-border/30 bg-transparent">
<div class="flex items-center gap-4 text-curateur-text w-full justify-center">
<h2 class="text-curateur-text text-sm font-medium uppercase tracking-[0.2em]">CURATEUR</h2>
</div>
</header>
</div>
<!-- Main Hero Section -->
<main class="relative h-screen w-full overflow-hidden flex items-center justify-center">
<!-- Background Image with Slow Zoom -->
<div class="absolute inset-0 z-0">
<div class="w-full h-full bg-cover bg-center animate-slow-zoom" data-alt="A sweeping, moody architectural interior shot featuring brutalist concrete forms interacting with soft, diffused natural light filtering through high windows. The setting is vast and minimalist, evoking a sense of monumental silence. Deep charcoal shadows contrast with pale alabaster highlights, creating a rich, dark-mode aesthetic. A single abstract sculpture stands in the distance, establishing a profound sense of scale and premium editorial atmosphere." style="background-image: linear-gradient(to bottom, rgba(10, 11, 10, 0.3), rgba(10, 11, 10, 0.7)), url('https://lh3.googleusercontent.com/aida-public/AB6AXuAKuSQAFfB5VYJ7LkHDLsaZm34vvc0kKo4SwV_ERGTNdzq4koGXMpThsCP_Heug0dtAUQgRGhXtaKKNpv4TmpmP-khbmLSmjqsWdVLm4h0pQp6Y7M3CYHPU_iKszA9d5595tXHdTmaG-0-S2WywrOvN7vpnEWhK7SNFp9IlWlsogJbiZ0aj7pIEbOj-H-Em1W0dbBPg63_sJ1zTzyQkcd_gaT9FF0AOtX1fff0qWswVHkpDvyE1K8ViJ0gnO7Nrd81DBOmKHH-5HIVR');">
</div>
</div>
<!-- Hero Title -->
<div class="relative z-10 text-center px-6 max-w-5xl hero-title-container">
<h1 class="font-display text-curateur-text text-[80px] md:text-[120px] leading-[0.9] tracking-tight">
                The <span class="italic font-light">Silence</span> of Space
            </h1>
</div>
<!-- Floating Glass Metadata Panel -->
<div class="absolute bottom-12 left-12 z-20 w-[320px] rounded glass-panel p-6">
<div class="flex flex-col gap-4">
<div class="flex justify-between items-end">
<div>
<p class="text-xs uppercase tracking-[0.1em] text-curateur-muted mb-1 font-medium">Featured Author</p>
<p class="text-curateur-text font-display text-xl italic">Elena Rostova</p>
</div>
<div class="text-right">
<p class="text-xs text-curateur-muted tracking-[0.05em]">12 MIN READ</p>
</div>
</div>
<!-- Progress Bar -->
<div class="w-full h-[1px] bg-curateur-border relative mt-2">
<div class="absolute top-0 left-0 h-full w-1/3 bg-primary"></div>
</div>
</div>
</div>
</main>
</body></html>
